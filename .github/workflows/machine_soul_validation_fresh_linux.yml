name: Machine-Soul validation set — fresh-linux

on:
  workflow_call:
    inputs:
      checks_json:
        description: Selected fresh-Linux check IDs as a JSON array
        required: true
        type: string

jobs:
  fresh-clone-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository from remote
        shell: bash
        run: |
          git clone "https://github.com/${GITHUB_REPOSITORY}.git" "${RUNNER_TEMP}/fresh-soul"
          git -C "${RUNNER_TEMP}/fresh-soul" checkout "${GITHUB_SHA}"
      - name: Check fresh-linux
        if: ${{ contains(fromJSON(inputs.checks_json), 'fresh-linux') }}
        shell: bash
        run: |
          cd "${RUNNER_TEMP}/fresh-soul"
          bash meta/tests/applications/test_linux_operations.sh
