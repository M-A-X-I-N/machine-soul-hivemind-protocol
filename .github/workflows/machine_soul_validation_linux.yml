name: Machine-Soul validation set — linux

on:
  workflow_call:
    inputs:
      checks_json:
        description: Selected Linux check IDs as a JSON array
        required: true
        type: string

jobs:
  linux_validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Smoke-test Python runtime package
        shell: bash
        run: python3 -c "import annexation_procedures as ms; ms.require_supported_python()"
      - name: Check linux-python
        if: ${{ contains(fromJSON(inputs.checks_json), 'linux-python') }}
        shell: bash
        run: python3 -m unittest discover -s autonomic_affairs/tests/python -p 'test_*.py'
      - name: Check linux-applications
        if: ${{ contains(fromJSON(inputs.checks_json), 'linux-applications') }}
        shell: bash
        run: bash autonomic_affairs/tests/applications/test_linux_operations.sh
      - name: Check linux-install
        if: ${{ contains(fromJSON(inputs.checks_json), 'linux-install') }}
        shell: bash
        run: bash autonomic_affairs/tests/install/test_linux_install_dry_run.sh
      - name: Check linux-session
        if: ${{ contains(fromJSON(inputs.checks_json), 'linux-session') }}
        shell: bash
        run: bash autonomic_affairs/tests/session/test_linux_account_boundaries.sh
      - name: Check linux-matrix
        if: ${{ contains(fromJSON(inputs.checks_json), 'linux-matrix') }}
        shell: bash
        run: bash autonomic_affairs/tests/matrix/test_linux_host_matrix.sh
