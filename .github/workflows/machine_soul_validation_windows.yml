name: Machine-Soul validation set — windows

on:
  workflow_call:
    inputs:
      checks_json:
        description: Selected Windows check IDs as a JSON array
        required: true
        type: string

jobs:
  windows_validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Smoke-test Python runtime package
        shell: powershell
        run: python -c "import annexation_procedures as ms; ms.require_supported_python()"
      - name: Check windows-python
        if: ${{ contains(fromJSON(inputs.checks_json), 'windows-python') }}
        shell: powershell
        run: python -m unittest discover -s autonomic_affairs/tests/python -p 'test_*.py'
      - name: Check windows-applications
        if: ${{ contains(fromJSON(inputs.checks_json), 'windows-applications') }}
        shell: powershell
        run: .\autonomic_affairs\tests\applications\test_windows_operations.ps1
      - name: Check windows-posix
        if: ${{ contains(fromJSON(inputs.checks_json), 'windows-posix') }}
        shell: bash
        run: bash autonomic_affairs/tests/applications/test_windows_posix_operations.sh
      - name: Check windows-install
        if: ${{ contains(fromJSON(inputs.checks_json), 'windows-install') }}
        shell: powershell
        run: .\autonomic_affairs\tests\install\test_windows_install_dry_run.ps1
