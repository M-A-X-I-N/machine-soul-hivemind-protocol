name: Framework validation

on:
  push:
    branches:
      - experimental/v2
  pull_request:
  workflow_dispatch:

jobs:
  linux-framework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Linux framework
        shell: bash
        run: bash tests/framework/test_linux.sh
      - name: Test Linux application operations
        shell: bash
        run: bash tests/applications/test_linux_operations.sh
      - name: Test Linux install dry-run ownership
        shell: bash
        run: bash tests/install/test_linux_install_dry_run.sh

  windows-framework:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Windows framework in Windows PowerShell 5.1
        shell: powershell
        run: .\tests\framework\test_windows.ps1
      - name: Test Windows application operations
        shell: powershell
        run: .\tests\applications\test_windows_operations.ps1
      - name: Test Windows install dry-run ownership
        shell: powershell
        run: .\tests\install\test_windows_install_dry_run.ps1
