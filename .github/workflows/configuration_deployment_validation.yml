name: Configuration deployment validation

on:
  push:
    branches:
      - experimental/v2
  pull_request:
  workflow_dispatch:

jobs:
  linux_configuration_deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Linux configuration deployment
        shell: bash
        run: bash collective_affairs/tests/configuration_deployment/test_linux.sh
      - name: Test Linux application operations
        shell: bash
        run: bash collective_affairs/tests/applications/test_linux_operations.sh
      - name: Test Linux install dry-run ownership
        shell: bash
        run: bash collective_affairs/tests/install/test_linux_install_dry_run.sh
      - name: Test Linux checkout relocation
        shell: bash
        run: bash collective_affairs/tests/relocation/test_linux_relocation.sh
      - name: Test Linux session/account boundaries
        shell: bash
        run: bash collective_affairs/tests/session/test_linux_account_boundaries.sh
      - name: Test Linux host/account matrix
        shell: bash
        run: bash collective_affairs/tests/matrix/test_linux_host_matrix.sh

  windows_configuration_deployment:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Windows configuration deployment in Windows PowerShell 5.1
        shell: powershell
        run: .\collective_affairs\tests\configuration_deployment\test_windows.ps1
      - name: Test Windows application operations
        shell: powershell
        run: .\collective_affairs\tests\applications\test_windows_operations.ps1
      - name: Test Windows POSIX-shell operations
        shell: bash
        run: bash collective_affairs/tests/applications/test_windows_posix_operations.sh
      - name: Test Windows install dry-run ownership
        shell: powershell
        run: .\collective_affairs\tests\install\test_windows_install_dry_run.ps1
      - name: Test Windows checkout relocation
        shell: powershell
        run: .\collective_affairs\tests\relocation\test_windows_relocation.ps1


  fresh-clone-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository from remote
        shell: bash
        run: |
          git clone "https://github.com/${GITHUB_REPOSITORY}.git" "${RUNNER_TEMP}/fresh-soul"
          git -C "${RUNNER_TEMP}/fresh-soul" checkout "${GITHUB_SHA}"
      - name: Validate from fresh clone
        shell: bash
        run: |
          cd "${RUNNER_TEMP}/fresh-soul"
          bash collective_affairs/tests/applications/test_linux_operations.sh

  fresh-clone-windows:
    runs-on: windows-latest
    steps:
      - name: Clone repository from remote
        shell: powershell
        run: |
          git clone "https://github.com/$env:GITHUB_REPOSITORY.git" "$env:RUNNER_TEMP\fresh-soul"
          git -C "$env:RUNNER_TEMP\fresh-soul" checkout "$env:GITHUB_SHA"
      - name: Validate from fresh clone
        shell: powershell
        run: |
          Set-Location "$env:RUNNER_TEMP\fresh-soul"
          .\collective_affairs\tests\applications\test_windows_operations.ps1
