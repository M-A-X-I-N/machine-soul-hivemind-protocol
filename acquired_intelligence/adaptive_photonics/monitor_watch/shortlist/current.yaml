schema_version: 1
updated: 2026-10-03T01:35:42+02:00
catalogue_source: ../models/monitors.yaml

criteria_summary:
  size: "27 or 32; current lean 32 but exceptional deals override preference"
  resolution: 3840x2160
  flat_required: true
  oled_required: true
  coating_preference: "glossy / TrueBlack Glossy > clear semi-gloss > matte"
  native_refresh: "165 Hz is already sufficient; 240 Hz is worth a modest premium"
  dual_mode: "330/480+ Hz is genuinely useful for competitive-shooter mode"
  dp21_standalone_value: negligible
  unusual_priorities:
    - low minimum luminance
    - small-text clarity
    - explicit burn-in warranty
    - predictable static-dimming behavior



true_rgb_stripe_lane:
  purpose: "Apply the normal purchase rules unchanged, but require a strict conventional/true RGB-stripe OLED subpixel layout."
  rules:
    inherit_all_normal_purchase_rules: true
    price_and_value_rules_apply_normally: true
    flat_required: true
    resolution_required: 3840x2160
    oled_required: true
    strict_subpixel_requirement: rgb_stripe
    notes:
      - "This is a filtered parallel shortlist, not a money-no-object lane."
      - "The user's normal Swedish street-price/value philosophy applies in full."
      - "A true-RGB monitor can still be rejected or price-watched for being bad value."
      - "Do not silently broaden strict RGB stripe to adjacent layouts such as Philips RGB Q-Stripe or TCL Matrix-Pure."

  candidates:
    asus_pg32ucwm:
      status: price_watch
      summary: {size_in: 31.5, panel: Tandem-RGB-OLED, coating: trueblack_glossy, native_hz: 240, dual_mode_hz: 480, subpixel: rgb_stripe}
      reasons_for:
        - "31.5-inch size matches the current lean toward 32 inches."
        - "True Tandem RGB OLED with conventional RGB stripe directly optimizes text/fine-line clarity."
        - "TrueBlack Glossy is highly aligned with the dark-room setup."
        - "4K240/FHD480 Dual Mode matches both cinematic/high-resolution and competitive low-resolution use."
        - "Three-year warranty including burn-in and useful OLED-care features."
      reasons_against:
        - "Current Swedish pricing remains launch-tax territory relative to excellent 8–10k OLED alternatives."
        - "The final text/subpixel improvement is real but currently not large enough to justify the roughly 14k+ price under the normal value rules."
      price_logic: {interesting_at_or_below_sek: 11000, very_strong_at_or_below_sek: 10000}

    asus_pg27ucwm:
      status: price_watch
      summary: {size_in: 26.5, panel: Tandem-OLED, coating: trueblack_glossy, native_hz: 240, dual_mode_hz: 480, subpixel: rgb_stripe}
      reasons_for:
        - "Roughly 166-PPI class plus conventional RGB stripe makes it the strongest current strict-RGB option for tiny text."
        - "TrueBlack Glossy and 4K240/FHD480 match the normal preferences well."
        - "Three-year warranty and OLED-care features."
      reasons_against:
        - "Current Swedish pricing remains roughly 13k+ launch-tax territory."
        - "Smaller physical size than the current 32-inch lean."
      price_logic: {interesting_at_or_below_sek: 10000, very_strong_at_or_below_sek: 9000}

    msi_mpg322urdx36:
      status: price_watch
      summary: {size_in: 31.5, panel: Penta-Tandem-QD-OLED, coating: darkarmor_unknown, native_hz: 360, subpixel: rgb_stripe}
      reasons_for:
        - "31.5-inch fifth-generation Penta-Tandem QD-OLED with explicit RGB Stripe layout."
        - "4K360 / 1440p520 / FHD680 is unusually aligned with competitive-shooter behavior."
        - "DarkArmor is intended to improve ambient-black retention and scratch resistance."
      reasons_against:
        - "Announced rather than established Swedish retail stock."
        - "Real coating quality, minimum luminance, firmware behavior, warranty and street price remain unresolved."
      price_logic: {interesting_at_or_below_sek: 11000}

  adjacent_text_focused_layouts_not_in_lane:
    - model_id: philips_32m2n8900p
      reason: "Philips calls this RGB Q-Stripe; potentially good for text, but it is not the strict conventional RGB-stripe requirement."
    - model_id: tcl_32x3a
      reason: "TCL Matrix-Pure explicitly targets text fringing, but it is a different pixel-layout concept."


